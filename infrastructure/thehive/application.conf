# ==============================================================================
# TheHive 4.1.24 Configuration File
# Academic Anti-Phishing SOAR Platform
# ==============================================================================

# Secret key for Play framework session security
play.http.secret.key = "AntiPhishingSOARSecretKey2026LabEnvChangeMeInProd"
play.http.secret.key = ${?THEHIVE_PLAY_SECRET}

# Database backend: JanusGraph over Cassandra CQL and Elasticsearch 7
db {
  provider = janusgraph
  janusgraph {
    storage {
      backend = cql
      hostname = ["cassandra"]
      cql {
        cluster-name = "th-cluster"
        keyspace = "thehive"
        read-consistency-level = "ONE"
        write-consistency-level = "ONE"
      }
    }
    index.search {
      backend = elasticsearch
      hostname = ["elasticsearch"]
      elasticsearch {
        index-name = "thehive"
      }
    }
  }
}

# Attachment and local file storage
storage {
  provider = localfs
  localfs.directory = "/opt/thp/thehive/files"
}

# Disable Cortex connector for initial Stage 1A (enabled in Stage 1B)
play.modules.disabled += "org.thp.thehive.connector.cortex.CortexModule"
