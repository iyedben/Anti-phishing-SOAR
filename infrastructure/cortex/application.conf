# ==============================================================================
# Cortex 3.1.8 Configuration File
# Academic Anti-Phishing SOAR Platform (Stage 1B)
# ==============================================================================

# Secret key used by Play framework session security
play.http.secret.key = "AntiPhishingCortexSecretKey2026LabChangeMeInProd"
play.http.secret.key = ${?CORTEX_SECRET}

# Dedicated Elasticsearch 7 backend (isolated from TheHive's Elasticsearch)
search {
  index = "cortex"
  uri = "http://cortex_elasticsearch:9200"
  nbshards = 1
  nbreplicas = 0
}

# Job execution settings - configured for Process Mode execution
job {
  runners = [process]
  directory = "/tmp/cortex-jobs"
}

# Local analyzer definitions
analyzer {
  urls = [
    "/opt/cortex/analyzers"
  ]
}

responder {
  urls = []
}
